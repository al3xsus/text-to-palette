name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # Triggers the build whenever you push to main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Adjust to your local Node version if needed
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Performs a clean install of exact dependencies

      - name: Build project
        run: npm run build # Outputs static assets to the /dist folder

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite outputs production builds here

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4